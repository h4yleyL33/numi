name: numi
description: "Numi, aplikasi belajar numerasi dasar untuk siswa SD."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  cloud_firestore: ^7.0.1
  crypto: ^3.0.7
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  google_sign_in: ^7.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sembast: ^3.9.0
  sembast_web: ^2.4.6+1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/krayon/
    - assets/fonts/mali-OFL.txt
    - assets/fonts/cabinsketch-OFL.txt
  fonts:
    - family: Mali
      fonts:
        - asset: assets/fonts/Mali-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mali-Bold.ttf
          weight: 700
    - family: Cabin Sketch
      fonts:
        - asset: assets/fonts/CabinSketch-Bold.ttf
          weight: 700
